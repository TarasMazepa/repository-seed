name: on-seed-updated.yml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'docs/from-seed/**'

jobs:
  on-seed-updated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository:
          - TarasMazepa/TarasMazepa
          - TarasMazepa/TarasMazepa.github.io
          - TarasMazepa/chess-handicap-slider
          - TarasMazepa/circular-todo
          - TarasMazepa/dart-docker-fastlane
          - TarasMazepa/github-action-cat
          - TarasMazepa/hivebud
          - TarasMazepa/hivecomb
          - TarasMazepa/homebrew-monoapp
          - TarasMazepa/homebrew-stax
          - TarasMazepa/http-template
          - TarasMazepa/monoapp
          - TarasMazepa/monolib
          - TarasMazepa/monorepohub
          - TarasMazepa/openscad.dart
          - TarasMazepa/personal
          - TarasMazepa/projects
          - TarasMazepa/secrets
          - TarasMazepa/solomiya-reading
          - TarasMazepa/sqliteraw.dart
          - TarasMazepa/stax
          - TarasMazepa/tbx-for-toolbox.dev
          - TarasMazepa/the-time-scramble
          - TarasMazepa/welcome-to-monoapp

      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: source-repo

      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: target-repo
          # PAT requires the following scopes:
          # - Classic PAT: 'repo' scope
          # - Fine-grained PAT: 'Contents' (read & write) and 'Pull requests' (read & write)
          token: ${{ secrets.PAT }}

      - name: Create and Auto-Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          cp source-repo/AGENTS.md target-repo/AGENTS.md
          mkdir -p target-repo/docs
          rm -rf target-repo/docs/from-seed
          cp -R source-repo/docs/from-seed target-repo/docs/
          cd target-repo

          git add AGENTS.md docs/from-seed

          # Check if there are any changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to a new branch
          BRANCH_NAME="update-from-seed-${GITHUB_RUN_ID}"
          git checkout -b $BRANCH_NAME

          # Commit the changes
          git commit -m "chore: changes from repository seed"
          git push -u origin $BRANCH_NAME

          # Create PR using gh cli
          PR_URL=$(gh pr create --title "Changes from repository seed" --body "This PR updates files from the seed repository." --base main --head $BRANCH_NAME)
          echo "Created PR: $PR_URL"

          # Enable auto-merge
          gh pr merge $PR_URL --auto --squash || gh pr merge $PR_URL --squash
